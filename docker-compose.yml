services:
  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "18080:18080"
    volumes:
      - ai_finance_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:18080
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  ocr:
    profiles: ["ocr"]
    build: ./ocr
    ports:
      - "18090:8090"
    volumes:
      - paddle_cache:/root/.paddleocr
    restart: unless-stopped

volumes:
  ai_finance_data:
  paddle_cache:
